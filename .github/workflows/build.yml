# Compila el APK en cada cambio a main y lo publica como "Release".
# Enlace fijo a la versión más reciente:
#   https://github.com/mactatuskm/mskynas/releases/latest/download/mskynas.apk
name: Compilar APK

on:
  push:
    branches: [main]
    # Cambios solo de notas no generan versión nueva (ni aviso de actualización en las TVs).
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} -PtmdbToken="$TMDB_TOKEN" 2>&1 | tee build.log; then
            # Publica los errores como anotación: se leen sin iniciar sesión en GitHub
            # (api.github.com/repos/<repo>/check-runs/<job>/annotations).
            errs=$(grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 \
              | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Errores de compilación::${errs}"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk mskynas.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: mskynas 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: mskynas.apk
